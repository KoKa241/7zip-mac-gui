name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Run Unit Tests
        run: |
          xcodebuild -project "7-Zip GUI/7-Zip GUI.xcodeproj" \
                     -scheme "7-Zip GUI" \
                     -destination "platform=macOS" \
                     -only-testing:"7-Zip GUITests" \
                     test
